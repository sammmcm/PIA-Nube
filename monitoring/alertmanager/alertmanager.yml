route:
  receiver: discord
  group_by: [alertname, vm]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      # El webhook NO vive en el repo: se guarda en alertmanager/secrets/discord_webhook (ignorado por git)
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook
        send_resolved: true
