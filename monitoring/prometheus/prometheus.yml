global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ---- VM-TOOLS (esta misma máquina) ----
  - job_name: node_vm_tools
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels: { vm: vm-tools }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Estado de los servicios de VM-TOOLS: Jenkins, SonarQube, Grafana
  - job_name: blackbox_http_tools          # usa el contenedor blackbox del docker-compose
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - http://host.docker.internal:8080/login      # Jenkins
          - http://host.docker.internal:9000/api/system/status   # SonarQube
          - http://grafana:3000/api/health              # Grafana
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---- VM-K8S ---- PENDIENTE: reemplazar IP_K8S por la IP real (la da la Persona 1)
  - job_name: node_vm_k8s
    static_configs:
      - targets: ["IP_K8S:9100"]                    # PENDIENTE Persona 1: node_exporter + puerto 9100 abierto en NSG
        labels: { vm: vm-k8s }

  - job_name: kube_state_metrics
    static_configs:
      - targets: ["IP_K8S:30808"]                   # PENDIENTE Persona 1: kube-state-metrics expuesto (NodePort 30808)

  - job_name: medisur_app
    metrics_path: /metrics
    static_configs:
      - targets: ["IP_K8S:30080"]                   # PENDIENTE Persona 1/2: app desplegada, NodePort 30080 abierto
