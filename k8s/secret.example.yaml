# PLANTILLA. NO pongas valores reales aqui ni subas el archivo "secret.yaml" al repo.
# Crea el secreto real directamente en el cluster:
#   kubectl -n medisur create secret generic medisur-secret --from-literal=api-token='<valor>'
apiVersion: v1
kind: Secret
metadata:
  name: medisur-secret
  namespace: medisur
type: Opaque
stringData:
  api-token: "REEMPLAZAR-EN-EL-CLUSTER"
