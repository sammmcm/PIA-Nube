apiVersion: v1
kind: Service
metadata:
  name: medisur-api
  namespace: medisur
  labels:
    app: medisur-api
spec:
  type: NodePort
  selector:
    app: medisur-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080     # abre este puerto (o 80 via ingress) en el NSG de VM-K8S
